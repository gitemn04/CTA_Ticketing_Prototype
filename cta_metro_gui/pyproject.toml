# Configuration for the development checks only (see requirements-dev.txt and README "Tests and checks").
# The app itself is run with `python cta_app.py`; this file does not make it an installable package.

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tools/make_logos.py"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E741",   # `l` for a route leg is used throughout the original code; renaming adds churn, not safety
    "E501",   # 145 lines over 120 characters (long messages, original test style): tracked, not reflowed in bulk
]

[tool.ruff.lint.per-file-ignores]
# The original test style (version 2.3) is kept: path set-up before imports and compact one-line assertions.
"tests/*" = ["E401", "E402", "E701", "E702", "E731"]

[tool.mypy]
python_version = "3.10"
files = ["cta_storage.py", "cta_payments.py", "cta_fares.py", "cta_tickets.py", "cta_auth.py", "cta_errors.py",
         "cta_core.py", "cta_db.py", "cta_routing.py", "cta_accounts.py", "cta_stats.py"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[tool.bandit]
exclude_dirs = ["tests", "tools"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", "tools/*", "setup_sms.py"]

[tool.coverage.report]
show_missing = false
skip_covered = false
precision = 1
